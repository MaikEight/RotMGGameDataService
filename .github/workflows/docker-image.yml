name: Build docker and push
env:
  DOCKER_BUILDKIT: 1
  COMPOSE_DOCKER_CLI_BUILD: 1
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        # The Dockerfile compiles the pinned extractor from vendor/, so the
        # submodule has to exist in the build context. Without this the build
        # fails on the missing project reference rather than on anything obvious.
        submodules: recursive
    - name: Extract version from Directory.Build.props
      run: |
        VERSION=$(sed -n 's/.*<Version>\(.*\)<\/Version>.*/\1/p' Directory.Build.props)
        if [ -z "$VERSION" ]; then
          echo "::error::No <Version> found in Directory.Build.props"
          exit 1
        fi
        echo "Building version $VERSION"
        echo "VERSION=$VERSION" >> $GITHUB_ENV
    - name: Set up .NET
      uses: actions/setup-dotnet@v4
      with:
        # Installs whatever global.json pins, so the SDK cannot drift from it.
        global-json-file: global.json
    - name: Cache NuGet packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Build.props') }}
        restore-keys: |
          ${{ runner.os }}-nuget-
    - name: Restore test dependencies
      # TargetFramework is pinned the same way the Dockerfile pins it: the
      # extractor also targets net8.0-windows, which cannot be restored or built
      # on this runner.
      run: dotnet restore tests/RotMGGameDataService.Tests/RotMGGameDataService.Tests.csproj /p:TargetFramework=net8.0
    - name: Run tests
      run: dotnet test tests/RotMGGameDataService.Tests/RotMGGameDataService.Tests.csproj --configuration Release --framework net8.0 --no-restore --verbosity minimal
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    - name: Login to Harbor Container Registry
      uses: docker/login-action@v3
      with:
        registry: harbor.devopskit.de
        username: ${{ secrets.HARBOR_USERNAME }}
        password: ${{ secrets.HARBOR_PASSWORD }}
    - name: Build and push Docker image
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ./Dockerfile
        push: true
        tags: harbor.devopskit.de/eam/eam_game_assets_api:${{ env.VERSION }}
        # A .NET restore and publish is far heavier than an npm install, so the
        # layer cache is worth keeping between runs.
        cache-from: type=gha
        cache-to: type=gha,mode=max
    - name: Log out from Harbor Container Registry
      run: docker logout harbor.devopskit.de
