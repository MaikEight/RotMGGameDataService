name: rotmg-game-data-service

x-app-environment: &app-environment
  ConnectionStrings__GameData: Host=postgres;Port=5432;Database=rotmg_game_data;Username=rotmg_service;Password=${POSTGRES_PASSWORD};Pooling=true;Maximum Pool Size=50;Timeout=10;Command Timeout=30
  Proxy__TrustForwardedHeaders: "true"
  DOTNET_EnableDiagnostics: "0"

x-api: &api
  build:
    context: .
  image: rotmg-game-data-service:local
  command: ["serve"]
  environment: *app-environment
  depends_on:
    postgres:
      condition: service_healthy
  read_only: true
  tmpfs:
    - /tmp:size=64m,mode=1777
  security_opt:
    - no-new-privileges:true
  restart: unless-stopped
  mem_limit: 512m
  cpus: 1.0
  networks:
    - frontend
    - backend
  healthcheck:
    test: ["CMD", "dotnet", "RotMGGameDataService.dll", "healthcheck", "http://127.0.0.1:8080/health/ready"]
    interval: 15s
    timeout: 6s
    retries: 5
    start_period: 30s

services:
  postgres:
    image: postgres:17.10-alpine
    environment:
      POSTGRES_DB: rotmg_game_data
      POSTGRES_USER: rotmg_service
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: --data-checksums
    volumes:
      - ${DATA_ROOT}/postgres:/var/lib/postgresql/data
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    mem_limit: 2g
    cpus: 2.0
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rotmg_service -d rotmg_game_data"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  api-a:
    <<: *api

  api-b:
    <<: *api

  worker:
    build:
      context: .
    image: rotmg-game-data-service:local
    command: ["worker"]
    environment: *app-environment
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ${DATA_ROOT}/worker:/data
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    mem_limit: 6g
    cpus: 4.0
    networks:
      - backend
      - outbound

  gateway:
    image: nginx:1.28-alpine
    depends_on:
      api-a:
        condition: service_healthy
      api-b:
        condition: service_healthy
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${HTTP_PORT:-8090}:8080"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=64m,mode=0755
      - /var/run:size=1m,mode=0755
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    mem_limit: 256m
    cpus: 1.0
    networks:
      - frontend
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

networks:
  frontend:
    internal: true
  backend:
    internal: true
  outbound:
