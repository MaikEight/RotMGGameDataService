name: rotmg-game-data-service

x-app-environment: &app-environment
  ConnectionStrings__GameData: Host=postgres;Port=5432;Database=rotmg_game_data;Username=rotmg_service;Password=${POSTGRES_PASSWORD};Pooling=true;Maximum Pool Size=20;Timeout=10;Command Timeout=30
  Proxy__TrustForwardedHeaders: "true"
  DOTNET_EnableDiagnostics: "0"

x-api: &api
  build:
    context: .
  image: rotmg-game-data-service:local
  command: ["serve"]
  environment: *app-environment
  depends_on:
    postgres:
      condition: service_healthy
  read_only: true
  tmpfs:
    - /tmp:size=64m,mode=1777
  security_opt:
    - no-new-privileges:true
  restart: unless-stopped
  mem_limit: 512m
  cpus: 1.0
  networks:
    - frontend
    - backend
  healthcheck:
    test: ["CMD", "dotnet", "RotMGGameDataService.dll", "healthcheck", "http://127.0.0.1:8080/health/ready"]
    interval: 15s
    timeout: 6s
    retries: 5
    start_period: 30s

services:
  postgres:
    build:
      context: .
      dockerfile: deploy/Dockerfile.postgres
    image: rotmg-game-data-postgres:local
    user: "70:70"
    environment:
      POSTGRES_DB: rotmg_game_data
      POSTGRES_USER: rotmg_service
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: --data-checksums
    volumes:
      - ${DATA_ROOT}/postgres:/var/lib/postgresql/data
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    mem_limit: 2g
    cpus: 2.0
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rotmg_service -d rotmg_game_data"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  backup:
    image: rotmg-game-data-postgres:local
    user: "70:70"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        while true; do
          stamp=$$(date -u +%Y%m%dT%H%M%SZ)
          partial="/backups/rotmg-game-data-$${stamp}.dump.partial"
          final="/backups/rotmg-game-data-$${stamp}.dump"
          pg_dump --host=postgres --username=rotmg_service --dbname=rotmg_game_data --format=custom --file="$$partial"
          mv "$$partial" "$$final"
          find /backups -type f -name 'rotmg-game-data-*.dump' -mtime +14 -delete
          sleep 86400
        done
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ${DATA_ROOT}/backups:/backups
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.5
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "find /backups -type f -name 'rotmg-game-data-*.dump' -mmin -1560 -print -quit | grep -q ."]
      interval: 1h
      timeout: 5s
      retries: 2
      start_period: 2m

  api-a:
    <<: *api

  api-b:
    <<: *api

  worker:
    build:
      context: .
    image: rotmg-game-data-service:local
    command: ["worker"]
    environment: *app-environment
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ${DATA_ROOT}/worker:/data
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    mem_limit: 6g
    cpus: 4.0
    networks:
      - backend
      - outbound

  gateway:
    build:
      context: .
      dockerfile: deploy/Dockerfile.gateway
    image: rotmg-game-data-gateway:local
    depends_on:
      api-a:
        condition: service_healthy
      api-b:
        condition: service_healthy
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${HTTP_PORT:-8090}:8080"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    mem_limit: 256m
    cpus: 1.0
    networks:
      - frontend
      - outbound
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

networks:
  frontend:
    internal: true
  backend:
    internal: true
  outbound:
