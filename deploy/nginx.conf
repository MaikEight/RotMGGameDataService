worker_processes 2;
pid /tmp/nginx.pid;

events {
    worker_connections 2048;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    sendfile on;
    keepalive_timeout 30s;
    client_max_body_size 16k;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    log_format main '$remote_addr - $request_method $uri $status $body_bytes_sent '
                    '$request_time "$http_user_agent"';
    access_log /dev/stdout main;
    error_log /dev/stderr warn;

    upstream game_data_api {
        least_conn;
        server api-a:8080 max_fails=1 fail_timeout=5s;
        server api-b:8080 max_fails=1 fail_timeout=5s;
        keepalive 32;
    }

    server {
        listen 8080;

        location / {
            proxy_pass http://game_data_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 250ms;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
        }
    }
}
